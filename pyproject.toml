[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codereels"
version = "0.1.0"
description = "View Instagram Reels in a focused desktop window."
requires-python = ">=3.11"
dependencies = [
    "pywebview>=6.2,<7",
    "platformdirs>=4,<5"
]

[project.gui-scripts]
codereels = "codereels.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

